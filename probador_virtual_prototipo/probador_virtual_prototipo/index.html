<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Probador virtual — Prototipo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Probador virtual</h1>
      <p>Prototipo 01 · detección de cuerpo + prenda PNG</p>
    </header>

    <section class="viewer">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>

      <div id="message" class="message">
        Presiona «Activar cámara» y colócate de frente.
      </div>
    </section>

    <section class="controls">
      <button id="start">Activar cámara</button>
      <button id="togglePose" disabled>Ocultar puntos</button>
      <label>
        Ajuste vertical
        <input id="offsetY" type="range" min="-0.20" max="0.25" step="0.01" value="0">
      </label>
      <label>
        Tamaño
        <input id="scale" type="range" min="0.75" max="1.35" step="0.01" value="1">
      </label>
    </section>

    <p class="note">
      La detección se realiza en el navegador. Esta primera versión usa hombros y caderas
      para colocar y adaptar la prenda.
    </p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
